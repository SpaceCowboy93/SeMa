name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Build must not fail due to missing env vars in CI.
          # Provide placeholders — this build is NOT deployed.
          NEXT_PUBLIC_SUPABASE_URL: https://wwxdinkdjkjiqzynfbdk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # Playwright E2E runs only when a dev server is available.
  # In this project the dev server requires real environment variables
  # (Supabase URL / anon key) which are not stored in CI.
  # Enable this job once a test environment is configured.
